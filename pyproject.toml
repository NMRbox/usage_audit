[project]
name = "usage_audit"
description = "TBD"
license = {text = "MIT" }
version = "1.0"
dependencies = ['pyyaml']
requires-python= ">= 3.12"
readme = "README.md"
authors = [
    {name = "Gerard"},
    {email = "gweatherby@uchc.edu"}
]

[tool.setuptools]
package-dir = {"" = "src" }  # Tells setuptools that the root package is in the "src" directory

[tool.setuptools.packages.find]
where = ["src"]  # Specify the "src" directory to look for packages


[project.scripts]
setup_nmrbox_audit = "usage_audit.nmrbox_audit_setup:main"
query_usage = "usage_audit.query_usage:main"
mapper = "usage_audit.python_mapper:main"

[project.optional-dependencies] 
# test = ['pytest']
loader = ['keyrings.efile',
	'postgresql_access',
	'psycopg']

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "nmrbox"
url = "https://apt.nmrbox.org/pip"

